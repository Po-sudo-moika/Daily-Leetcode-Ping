[service]
name = "LeetcodePingService"
version = "1.0.0"
env = "production"

# The bot token and the owner id are NOT stored here. Set TELEGRAM_BOT_TOKEN
# and TELEGRAM_OWNER_ID (see README.md).
[telegram]
# Fixed recipients. They get the start-up post and the daily post,
# in addition to every chat the bot is in (see README.md).
telegramChats = [
	"your chat id"
]

[storage]
# Where subscriptions are kept. Mount this folder as a Docker volume.
subscribersPath = "data/subscribers.json"
# Where the LeetCode usernames people linked are kept (same folder).
linksPath = "data/leetcode-links.json"
